<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>演唱會歌曲測驗</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: 左側作答區 + 右側完成名單，窄螢幕改為上下排列。背景是淡淡的圖表格線。 */
:root {
  --bg: #f0ecf9;
  --surface: #ffffff;
  --ink: #1f1238;
  --muted: #66597f;
  --line: #d9d0ec;
  --grid: rgba(31, 18, 56, 0.05);
  --accent: #6d28d9;
  --accent-soft: #e9ddfc;
  --on-accent: #ffffff;
  --wrong: #a3185f;
  --wrong-soft: #f8e0ee;
  --font-display: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #130d22; --surface: #1c1430; --ink: #efe9fb; --muted: #a99ac7; --line: #33264f;
    --grid: rgba(239, 233, 251, 0.04); --accent: #b794ff; --accent-soft: #33205c; --on-accent: #140a26;
    --wrong: #ff8cc4; --wrong-soft: #3b1230; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #130d22; --surface: #1c1430; --ink: #efe9fb; --muted: #a99ac7; --line: #33264f;
  --grid: rgba(239, 233, 251, 0.04); --accent: #b794ff; --accent-soft: #33205c; --on-accent: #140a26;
  --wrong: #ff8cc4; --wrong-soft: #3b1230; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--ink);
  font: 400 16px/1.65 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 24px; }
.mast { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.mast svg { flex: none; width: 84px; height: 48px; color: var(--accent); }
.mast .tt { flex: 1 1 260px; min-width: 0; }
.mast h1 { font: 900 clamp(28px, 6vw, 40px)/1.15 var(--font-display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.mast p { margin: 6px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.cols.solo { grid-template-columns: minmax(0, 1fr); max-width: 720px; width: 100%; margin: 0 auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; min-width: 0; }
.panel h2 { font: 700 20px/1.3 var(--font-display); margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
label.field { display: block; font-weight: 500; margin: 18px 0 6px; }
input[type="text"], textarea {
  width: 100%; min-height: 46px; padding: 8px 12px; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
textarea { resize: vertical; min-height: 72px; }
input[type="text"]:focus-visible, textarea:focus-visible, button:focus-visible, input[type="radio"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.err.okmsg { color: var(--accent); }
.err { color: var(--wrong); font-size: 14px; min-height: 22px; margin: 6px 0 0; }
.btn {
  min-height: 46px; padding: 8px 22px; border: 0; border-radius: 8px; cursor: pointer;
  font: 700 16px var(--font-body); background: var(--accent); color: var(--on-accent);
}
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.note { margin: 14px 0 0; padding: 10px 14px; background: var(--wrong-soft); border-radius: 8px; font-size: 14px; }
.prog { display: flex; gap: 5px; margin-bottom: 16px; }
.prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.prog i.done { background: var(--ink); }
.prog i.now { background: var(--accent); }
.qno { font: 600 13px var(--font-mono); letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.q { font: 700 20px/1.5 var(--font-display); margin: 0 0 16px; text-wrap: balance; overflow-wrap: anywhere; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: baseline; text-align: left; width: 100%;
  min-height: 48px; padding: 10px 14px; font: 400 16px/1.5 var(--font-body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
}
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt b { font: 600 13px var(--font-mono); color: var(--muted); flex: none; }
.opt:disabled { cursor: default; }
.opt.ok { background: var(--accent-soft); border-color: var(--accent); }
.opt.ok b::after { content: " ✓"; color: var(--accent); }
.opt.bad { background: var(--wrong-soft); border-color: var(--wrong); text-decoration: line-through; text-decoration-thickness: 1px; }
.opt.bad b::after { content: " ✗"; color: var(--wrong); }
.why { margin: 14px 0 0; padding: 12px 14px; background: var(--bg); border-radius: 8px; font-size: 15px; overflow-wrap: anywhere; }
.score { font: 600 56px/1 var(--font-mono); margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
.score small { font-size: 24px; color: var(--muted); }
.status { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.status.ok { color: var(--accent); }
.status.bad { color: var(--wrong); }
.cnt { font: 500 14px var(--font-mono); color: var(--muted); margin: 0 0 12px; }
ol.list { list-style: none; margin: 0; padding: 0; display: grid; }
ol.list li {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px;
  padding: 11px 0; border-top: 1px solid var(--line);
}
ol.list li:first-child { border-top: 0; }
.nm { font-weight: 500; overflow-wrap: anywhere; }
.nm em { font-style: normal; font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
.sc { font: 600 15px var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.meta { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.meta button, .lnk { background: none; border: 0; padding: 0; color: var(--wrong); font: inherit; cursor: pointer; text-decoration: underline; }
.empty { color: var(--muted); font-size: 15px; margin: 0; }
.admin { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
/* editor */
.qcard { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-top: 14px; display: grid; gap: 10px; }
.qcard h3 { font: 600 13px var(--font-mono); letter-spacing: .06em; color: var(--muted); margin: 0; }
.orow { display: flex; gap: 10px; align-items: center; }
.orow input[type="radio"] { flex: none; width: 20px; height: 20px; accent-color: var(--accent); }
.orow b { font: 600 13px var(--font-mono); color: var(--muted); flex: none; width: 14px; }
.orow input[type="text"] { min-width: 0; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.vid { display: grid; gap: 8px; margin-bottom: 14px; }
.vid video, .evid { width: 100%; max-height: 360px; background: #000; border-radius: 8px; }
.vid a { font-size: 14px; color: var(--accent); overflow-wrap: anywhere; }
.mbox { display: grid; gap: 8px; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; }
.mbox input[type="file"] { font: inherit; font-size: 14px; max-width: 100%; }
@media (prefers-reduced-motion: no-preference) { .opt { transition: border-color .15s, background-color .15s; } }
</style>

<main class="wrap">
  <header class="mast">
    <svg viewBox="0 0 84 48" role="img" aria-label="音樂圖示" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <path d="M4 24v0M14 14v20M24 6v36M34 16v16M44 22v4M54 10v28M64 18v12M74 24v0"/>
    </svg>
    <div class="tt">
      <h1 id="ttl">演唱會歌曲測驗</h1>
      <p id="subttl"></p>
    </div>
    <button class="btn ghost sm" id="editBtn" type="button" hidden>編輯題目</button>
  </header>
  <div class="cols solo" id="cols">
    <section class="panel" id="stage" aria-live="polite"></section>
    <aside class="panel" id="roster" aria-labelledby="rh" hidden>
      <h2 id="rh">作答紀錄（匿名）</h2>
      <p class="cnt" id="cnt"></p>
      <ol class="list" id="list"></ol>
      <p class="empty" id="empty">名單載入中。</p>
      <div class="admin" id="admin" hidden></div>
    </aside>
  </div>
  <section class="panel" id="backoffice" hidden>
    <h2>後台資料庫</h2>
    <p class="sub">題庫和名單都存在這一頁的資料庫裡。匯出成 CSV 後，可以用 Excel 或 Google 試算表編輯，改完再匯入，網頁會立刻更新。</p>
    <div class="actions">
      <button class="btn ghost sm" id="boExpQ" type="button">匯出題庫 CSV</button>
      <label class="btn ghost sm" for="boImp" style="display:inline-flex;align-items:center;cursor:pointer">匯入題庫 CSV</label>
      <input id="boImp" type="file" accept=".csv,text/csv,.txt" hidden>
      <button class="btn ghost sm" id="boExpA" type="button">匯出作答紀錄 CSV</button>
    </div>
    <p class="sub" style="margin-top:12px">CSV 欄位：題目、選項A～D、正確答案（填 A、B、C 或 D）、解析、影片檔ID、影片連結。已上傳的影片請保留「影片檔ID」那一欄，不要改。</p>
    <p class="status" id="boMsg" role="status"></p>
    <div class="actions" id="boApply" hidden></div>
  </section>
</main>

<script>
const DEFAULT = {
  title: "演唱會歌曲測驗",
  sub: "每題作答後會立刻顯示解析。",
  questions: [
    { q: "（範例題目）這場演唱會的開場曲是哪一首？", o: ["歌曲 A", "歌曲 B", "歌曲 C", "歌曲 D"], a: 0, why: "這是範例。請按右上角的「編輯題目」換成你的歌曲。" },
    { q: "（範例題目）安可曲的第一首是哪一首？", o: ["歌曲 A", "歌曲 B", "歌曲 C", "歌曲 D"], a: 2, why: "這是範例。" },
    { q: "（範例題目）下列哪一首是這張專輯的主打歌？", o: ["歌曲 A", "歌曲 B", "歌曲 C", "歌曲 D"], a: 1, why: "這是範例。" }
  ]
};
let TITLE = DEFAULT.title, SUB = DEFAULT.sub, Q = DEFAULT.questions, N = Q.length;
const L = "ABCD";
const stage = document.getElementById("stage");
const listEl = document.getElementById("list");
const cntEl = document.getElementById("cnt");
const emptyEl = document.getElementById("empty");
const adminEl = document.getElementById("admin");
const editBtn = document.getElementById("editBtn");

let phase = "intro", idx = 0, score = 0, picked = null, name = "", nameErr = "";
let db = null, uid = null, isOwner = false, rows = [], listReady = false, saveState = "";
let assetsApi = null, dlApi = null, savedNote = false, importQs = null;
let cfgExists = false, pendingCfg = null, editing = false, draft = null, editMsg = "", clearArm = false;
let view = location.hash === "#admin" ? "admin" : "public", editOk = false, draftSynced = false;
function isAdmin() { return view === "admin" && isOwner && !!db; }


function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function me() { return rows.find(r => r.id === uid); }

function paintMast() {
  document.getElementById("ttl").textContent = TITLE;
  document.getElementById("subttl").textContent = isAdmin() ? "後台：只有你看得到這一頁。" : "共 " + N + " 題。" + SUB;
  document.title = TITLE;
  editBtn.hidden = !(isOwner && db && location.hash === "#admin");
  editBtn.textContent = view === "admin" ? "預覽測驗頁" : "回到後台";
  document.getElementById("backoffice").hidden = !isAdmin();
  document.getElementById("roster").hidden = !isAdmin();
  document.getElementById("cols").classList.toggle("solo", !isAdmin());
}

function applyCfg(c) {
  if (c && c.questions && c.questions.length) {
    TITLE = c.title || DEFAULT.title; SUB = c.sub || ""; Q = c.questions; cfgExists = true;
  } else { TITLE = DEFAULT.title; SUB = DEFAULT.sub; Q = DEFAULT.questions; cfgExists = false; }
  N = Q.length;
  paintMast();
}

function renderStage() {
  stage.replaceChildren();
  if (isAdmin()) { if (!draft) initDraft(); return renderEditor(); }
  if (phase === "intro") return renderIntro();
  if (phase === "quiz") return renderQuiz();
  renderResult();
}

function renderIntro() {
  stage.append(el("h2", "", "準備好了嗎"));
  stage.append(el("p", "sub", "共 " + N + " 題，每題作答後會顯示解析。不需要輸入名字。"));
  const mine = me();
  if (mine) stage.append(el("p", "sub", "你已作答 " + mine.tries + " 次，最高 " + mine.best + " / " + mine.total + " 分。可以再做一次。"));
  const b = el("button", "btn", "開始"); b.type = "button";
  b.addEventListener("click", () => {
    phase = "quiz"; idx = 0; score = 0; picked = null; saveState = "";
    renderStage();
  });
  const acts = el("div", "actions"); acts.append(b);
  stage.append(acts);
}

function mediaEl(q) {
  if (!q.video && !q.link) return null;
  const w = el("div", "vid");
  if (q.video) {
    const v = document.createElement("video");
    v.controls = true; v.playsInline = true; v.preload = "metadata"; v.src = "/_blob/" + q.video;
    v.setAttribute("aria-label", "題目影片");
    w.append(v);
  }
  if (q.link) {
    const a = el("a", "", "在新分頁開啟影片連結 ↗");
    a.href = q.link; a.target = "_blank"; a.rel = "noopener noreferrer";
    w.append(a);
  }
  return w;
}

function renderQuiz() {
  const q = Q[idx];
  const prog = el("div", "prog");
  for (let i = 0; i < N; i++) prog.append(el("i", i < idx ? "done" : i === idx ? "now" : ""));
  stage.append(prog, el("p", "qno", "第 " + (idx + 1) + " 題 / 共 " + N + " 題"));
  const m = mediaEl(q); if (m) stage.append(m);
  stage.append(el("p", "q", q.q));
  const opts = el("div", "opts"); const btns = [];
  q.o.forEach((t, i) => {
    const b = el("button", "opt"); b.type = "button";
    b.append(el("b", "", L[i]), el("span", "", t));
    btns.push(b);
    b.addEventListener("click", () => {
      picked = i; if (i === q.a) score++;
      btns.forEach((bb, j) => { bb.disabled = true; if (j === q.a) bb.classList.add("ok"); else if (j === i) bb.classList.add("bad"); });
      const nx = el("button", "btn next", idx === N - 1 ? "看成績" : "下一題"); nx.type = "button";
      nx.addEventListener("click", () => {
        picked = null;
        if (idx === N - 1) { phase = "result"; renderStage(); finish(); }
        else { idx++; renderStage(); }
      });
      const acts = el("div", "actions"); acts.append(nx);
      stage.append(el("p", "why", (i === q.a ? "答對了。" : "正確答案是 " + L[q.a] + "。") + (q.why ? q.why : "")), acts);
      nx.focus();
    });
    opts.append(b);
  });
  stage.append(opts);
}

function renderResult() {
  stage.append(el("h2", "", "完成了"));
  const sc = el("p", "score", String(score)); sc.append(el("small", "", " / " + N));
  stage.append(sc);
  const msg = score === N ? "全對，你是真歌迷。" : score >= N * 0.75 ? "很熟了，只差一點點。" : score >= N * 0.5 ? "及格了，錯的題目可以回頭看解析。" : "再把歌單聽一遍，下次會更好。";
  stage.append(el("p", "sub", msg));
  const acts = el("div", "actions");
  const again = el("button", "btn", "再做一次"); again.type = "button";
  again.addEventListener("click", () => { phase = "intro"; if (pendingCfg) { applyCfg(pendingCfg.c); pendingCfg = null; } renderStage(); });
  acts.append(again);
  stage.append(acts);
}

async function finish() {
  if (!db || !uid) { saveState = "off"; if (phase === "result") renderStage(); return; }
  saveState = "";
  renderStage();
  try {
    const ref = db.doc("attempts/" + uid);
    const snap = await ref.get();
    const p = snap.exists ? snap.data() : {};
    await ref.set({
      score: score, total: N,
      best: Math.max(score, p.best || 0), tries: (p.tries || 0) + 1,
      takenAt: new Date().toISOString()
    });
    saveState = "ok";
  } catch (e) { saveState = "err"; }
  if (phase === "result") renderStage();
}

/* ---------- 編輯器（只有擁有者看得到） ---------- */
function initDraft() {
  draft = {
    title: TITLE, sub: SUB,
    questions: Q.map(q => ({ q: q.q, o: [0, 1, 2, 3].map(i => q.o[i] || ""), a: q.a, why: q.why || "", video: q.video || "", link: q.link || "" }))
  };
}

function renderEditor() {
  stage.append(el("h2", "", "編輯測驗"));
  stage.append(el("p", "sub", "改完按「儲存」，所有人下次打開就會看到新題目。已經在名單上的成績不會改變。"));

  const l1 = el("label", "field", "標題"); l1.htmlFor = "e-title";
  const t1 = el("input"); t1.type = "text"; t1.id = "e-title"; t1.maxLength = 40; t1.value = draft.title;
  t1.addEventListener("input", () => { draft.title = t1.value; });
  const l2 = el("label", "field", "副標題（可留空）"); l2.htmlFor = "e-sub";
  const t2 = el("input"); t2.type = "text"; t2.id = "e-sub"; t2.maxLength = 80; t2.value = draft.sub;
  t2.addEventListener("input", () => { draft.sub = t2.value; });
  stage.append(l1, t1, l2, t2);

  draft.questions.forEach((d, n) => {
    const card = el("div", "qcard");
    card.append(el("h3", "", "第 " + (n + 1) + " 題"));
    const ta = el("textarea"); ta.id = "q" + n; ta.value = d.q; ta.placeholder = "題目，例如：這首歌是哪一首？";
    ta.setAttribute("aria-label", "第 " + (n + 1) + " 題題目");
    ta.addEventListener("input", () => { d.q = ta.value; });
    card.append(ta);
    d.o.forEach((t, i) => {
      const row = el("div", "orow");
      const r = el("input"); r.type = "radio"; r.name = "ans" + n; r.checked = d.a === i;
      r.setAttribute("aria-label", "第 " + (n + 1) + " 題選項 " + L[i] + " 是正確答案");
      r.addEventListener("change", () => { d.a = i; });
      const tx = el("input"); tx.type = "text"; tx.value = t; tx.placeholder = "選項 " + L[i] + (i > 1 ? "（可留空）" : "");
      tx.setAttribute("aria-label", "第 " + (n + 1) + " 題選項 " + L[i]);
      tx.addEventListener("input", () => { d.o[i] = tx.value; });
      row.append(r, el("b", "", L[i]), tx);
      card.append(row);
    });
    card.append(el("p", "hint", "選項左邊的圓點是正確答案。"));
    const why = el("input"); why.type = "text"; why.value = d.why; why.placeholder = "解析（可留空）";
    why.setAttribute("aria-label", "第 " + (n + 1) + " 題解析");
    why.addEventListener("input", () => { d.why = why.value; });
    card.append(why);
    const mb = el("div", "mbox");
    mb.append(el("p", "hint", "影片（可選）：上傳的檔案會顯示在題目上方，可以直接播放，單檔上限 20 MB。較長的影片請貼連結。"));
    if (d.video) {
      const v = document.createElement("video");
      v.className = "evid"; v.controls = true; v.playsInline = true; v.preload = "metadata"; v.src = "/_blob/" + d.video;
      const rmv = el("button", "btn ghost sm", "移除影片檔"); rmv.type = "button";
      rmv.addEventListener("click", () => { d.video = ""; renderStage(); });
      mb.append(v, rmv);
    } else if (assetsApi) {
      const f = el("input"); f.type = "file"; f.accept = "video/*"; f.setAttribute("aria-label", "第 " + (n + 1) + " 題上傳影片");
      const st = el("p", "hint", "");
      f.addEventListener("change", async () => {
        const file = f.files && f.files[0]; if (!file) return;
        if (file.size > 20 * 1024 * 1024) { st.textContent = "檔案超過 20 MB。請剪短或壓縮，或改貼連結。"; return; }
        st.textContent = "上傳中，請稍候。"; f.disabled = true;
        try { const r = await assetsApi.upload(file); d.video = r.id; renderStage(); }
        catch (e) { st.textContent = "上傳失敗，請再試一次。"; f.disabled = false; }
      });
      mb.append(f, st);
    } else mb.append(el("p", "hint", "這個帳號無法上傳影片檔，可以改貼連結。"));
    const lk = el("input"); lk.type = "text"; lk.value = d.link || ""; lk.placeholder = "影片連結（YouTube 等，https://…）";
    lk.setAttribute("aria-label", "第 " + (n + 1) + " 題影片連結");
    lk.addEventListener("input", () => { d.link = lk.value; });
    mb.append(lk);
    card.append(mb);
    const tools = el("div", "tools");
    const up = el("button", "btn ghost sm", "上移"); up.type = "button"; up.disabled = n === 0;
    up.addEventListener("click", () => { draft.questions.splice(n - 1, 0, draft.questions.splice(n, 1)[0]); renderStage(); });
    const dn = el("button", "btn ghost sm", "下移"); dn.type = "button"; dn.disabled = n === draft.questions.length - 1;
    dn.addEventListener("click", () => { draft.questions.splice(n + 1, 0, draft.questions.splice(n, 1)[0]); renderStage(); });
    const rm = el("button", "btn ghost sm", "刪除這題"); rm.type = "button"; rm.disabled = draft.questions.length <= 1;
    rm.addEventListener("click", () => { draft.questions.splice(n, 1); renderStage(); });
    tools.append(up, dn, rm);
    card.append(tools);
    stage.append(card);
  });

  const add = el("button", "btn ghost", "新增一題"); add.type = "button";
  add.addEventListener("click", () => { draft.questions.push({ q: "", o: ["", "", "", ""], a: 0, why: "", video: "", link: "" }); renderStage(); const t = document.getElementById("q" + (draft.questions.length - 1)); if (t) t.focus(); });
  const acts = el("div", "actions");
  acts.append(add);
  stage.append(acts);

  stage.append(el("p", "err" + (editOk ? " okmsg" : ""), editMsg));
  const acts2 = el("div", "actions");
  const save = el("button", "btn", "儲存"); save.type = "button"; save.addEventListener("click", saveCfg);
  const cancel = el("button", "btn ghost", "還原"); cancel.type = "button";
  cancel.addEventListener("click", () => { draft = null; editMsg = ""; editOk = false; renderStage(); });
  acts2.append(save, cancel);
  stage.append(acts2);
}

async function saveCfg() {
  editOk = false;
  const qs = [];
  for (let n = 0; n < draft.questions.length; n++) {
    const d = draft.questions[n];
    const text = d.q.trim(); const opts = []; let ans = -1;
    d.o.forEach((t, i) => { const s = t.trim(); if (s) { if (i === d.a) ans = opts.length; opts.push(s); } });
    if (!text || opts.length < 2 || ans < 0) {
      editMsg = "第 " + (n + 1) + " 題需要題目、至少兩個選項，而且正確答案不能是空白的選項。";
      renderStage(); return;
    }
    const link = (d.link || "").trim();
    if (link && !/^https?:\/\//i.test(link)) { editMsg = "第 " + (n + 1) + " 題的影片連結要以 https:// 開頭。"; renderStage(); return; }
    qs.push({ q: text, o: opts, a: ans, why: d.why.trim(), video: d.video || "", link: link });
  }
  try {
    const cfg = { title: draft.title.trim() || DEFAULT.title, sub: draft.sub.trim(), questions: qs };
    await db.doc("config/quiz").set({ title: cfg.title, sub: cfg.sub, questions: qs, updatedAt: new Date().toISOString() });
    applyCfg(cfg);
    draft = null; editOk = true; editMsg = "已儲存，新題目已生效。";
    renderStage();
  } catch (e) { editMsg = "儲存失敗，請稍後再試。"; renderStage(); }
}

/* ---------- 名單 ---------- */
function fmt(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
}

function renderList() {
  listEl.replaceChildren();
  cntEl.textContent = db && listReady ? "共 " + rows.length + " 筆作答紀錄" : "";
  emptyEl.hidden = !(db ? listReady && rows.length === 0 : true);
  if (!db) emptyEl.textContent = "名單需要登入 Claude 後才會顯示與記錄。";
  else if (listReady && rows.length === 0) emptyEl.textContent = "還沒有人作答。";
  rows.forEach((r, i) => {
    const li = el("li");
    const nm = el("span", "nm", "第 " + (rows.length - i) + " 位");
    const sc = el("span", "sc", r.score + " / " + r.total);
    const meta = el("div", "meta");
    meta.append(el("span", "", fmt(r.takenAt)), el("span", "", "作答 " + (r.tries || 1) + " 次"), el("span", "", "最高 " + (r.best != null ? r.best : r.score)));
    if (isAdmin()) {
      const del = el("button", "", "移除"); del.type = "button";
      del.addEventListener("click", () => { db.doc("attempts/" + r.id).delete().catch(() => {}); });
      meta.append(del);
    }
    li.append(nm, sc, meta);
    listEl.append(li);
  });
  renderAdmin();
}

function renderAdmin() {
  adminEl.replaceChildren();
  adminEl.hidden = !(isAdmin() && rows.length > 0);
  if (adminEl.hidden) return;
  const b = el("button", "lnk", clearArm ? "再按一次，確定清空全部名單" : "清空全部名單"); b.type = "button";
  b.addEventListener("click", async () => {
    if (!clearArm) { clearArm = true; renderAdmin(); setTimeout(() => { clearArm = false; renderAdmin(); }, 5000); return; }
    clearArm = false;
    for (const r of rows.slice()) { try { await db.doc("attempts/" + r.id).delete(); } catch (e) {} }
  });
  adminEl.append(b);
}

/* ---------- 後台：CSV 匯出與匯入 ---------- */
const boMsg = document.getElementById("boMsg"), boApply = document.getElementById("boApply");
function say(t, bad) { boMsg.textContent = t; boMsg.className = "status " + (bad ? "bad" : "ok"); }
function csvCell(v) { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function toCSV(rows) { return rows.map(r => r.map(csvCell).join(",")).join("\r\n"); }
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const out = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); out.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ""));
}
async function saveFile(filename, text) {
  if (!dlApi) { say("這個環境無法下載檔案。", true); return; }
  try { await dlApi.save({ filename: filename, data: "\uFEFF" + text }); say("已匯出 " + filename + "。"); }
  catch (e) { if (e && e.code === "declined") say("已取消匯出。"); else say("匯出失敗，請再試一次。", true); }
}
document.getElementById("boExpQ").addEventListener("click", () => {
  const out = [["題目", "選項A", "選項B", "選項C", "選項D", "正確答案", "解析", "影片檔ID", "影片連結"]];
  Q.forEach(q => out.push([q.q, q.o[0] || "", q.o[1] || "", q.o[2] || "", q.o[3] || "", L[q.a], q.why || "", q.video || "", q.link || ""]));
  saveFile("題庫.csv", toCSV(out));
});
document.getElementById("boExpA").addEventListener("click", () => {
  const out = [["序號", "最近成績", "總題數", "最高分", "作答次數", "最近作答時間"]];
  rows.forEach((r, i) => out.push([rows.length - i, r.score, r.total, r.best != null ? r.best : r.score, r.tries || 1, r.takenAt || ""]));
  saveFile("作答紀錄.csv", toCSV(out));
});
document.getElementById("boImp").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  importQs = null; boApply.hidden = true; boApply.replaceChildren();
  if (!f) return;
  const fr = new FileReader();
  fr.onerror = () => say("讀不到這個檔案。", true);
  fr.onload = () => {
    const rows = parseCSV(String(fr.result));
    if (rows.length && rows[0][0].trim() === "題目") rows.shift();
    const qs = [];
    for (let n = 0; n < rows.length; n++) {
      const r = rows[n].map(x => (x || "").trim());
      const raw = [r[1], r[2], r[3], r[4]].map(x => x || "");
      const k = "ABCD".indexOf((r[5] || "").toUpperCase().charAt(0));
      const k2 = k >= 0 ? k : ("1234".indexOf((r[5] || "").charAt(0)));
      const opts = []; let ans = -1;
      raw.forEach((t, i) => { if (t) { if (i === k2) ans = opts.length; opts.push(t); } });
      if (!r[0] || opts.length < 2 || ans < 0) { say("第 " + (n + 1) + " 題有問題：需要題目、至少兩個選項，正確答案要填 A、B、C 或 D，而且那個選項不能是空白。", true); return; }
      const link = r[8] || "";
      if (link && !/^https?:\/\//i.test(link)) { say("第 " + (n + 1) + " 題的影片連結要以 https:// 開頭。", true); return; }
      qs.push({ q: r[0], o: opts, a: ans, why: r[6] || "", video: r[7] || "", link: link });
    }
    if (!qs.length) { say("檔案裡沒有題目。", true); return; }
    importQs = qs;
    say("讀到 " + qs.length + " 題。按「套用」會用這些題目取代目前全部題目。");
    const ap = el("button", "btn sm", "套用 " + qs.length + " 題"); ap.type = "button";
    const no = el("button", "btn ghost sm", "取消"); no.type = "button";
    no.addEventListener("click", () => { importQs = null; boApply.hidden = true; boApply.replaceChildren(); say("已取消匯入。"); });
    ap.addEventListener("click", async () => {
      ap.disabled = true;
      try {
        const qsNew = importQs;
        await db.doc("config/quiz").set({ title: TITLE, sub: SUB, questions: qsNew, updatedAt: new Date().toISOString() });
        applyCfg({ title: TITLE, sub: SUB, questions: qsNew }); draft = null; renderStage();
        importQs = null; boApply.hidden = true; boApply.replaceChildren(); say("已套用，網頁已更新。");
      } catch (err) { ap.disabled = false; say("套用失敗，請再試一次。", true); }
    });
    boApply.append(ap, no); boApply.hidden = false;
  };
  fr.readAsText(f, "utf-8");
});

editBtn.addEventListener("click", () => {
  view = view === "admin" ? "public" : "admin";
  if (pendingCfg) { applyCfg(pendingCfg.c); pendingCfg = null; }
  phase = "intro"; draft = null; draftSynced = true;
  paintMast(); renderStage(); renderList();
});
renderStage();
renderList();
paintMast();

(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const user = await claude.use("user");
    if (user) {
      uid = await user.id();
      isOwner = await user.isOwner();
    }
  } catch (e) {}
  try { db = await claude.use("db"); } catch (e) { db = null; }
  try { assetsApi = await claude.use("assets"); } catch (e) { assetsApi = null; }
  try { dlApi = await claude.use("downloads"); } catch (e) { dlApi = null; }
  paintMast();
  if (!db) { renderList(); return; }
  db.doc("config/quiz").onSnapshot(
    snap => {
      const c = snap.exists ? snap.data() : null;
      if (phase === "quiz") { pendingCfg = { c: c }; return; }
      applyCfg(c);
      if (isAdmin()) { if (!draftSynced) { draftSynced = true; draft = null; renderStage(); } return; }
      if (!(phase === "intro" && document.activeElement && document.activeElement.id === "name")) renderStage();
    },
    () => {}
  );
  db.collection("attempts").orderBy("takenAt", "desc").limit(200).onSnapshot(
    snap => {
      rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); listReady = true; renderList();
      if (!isAdmin() && phase === "intro" && !(document.activeElement && document.activeElement.id === "name")) renderStage();
    },
    () => { listReady = true; emptyEl.hidden = false; emptyEl.textContent = "名單暫時載入失敗，稍後重新整理。"; }
  );
})();
